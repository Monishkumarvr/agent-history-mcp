[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-history-mcp"
version = "0.4.0"
description = "Local cross-agent memory, handoff, analytics and skill mining for Claude Code, Codex, Gemini CLI, OpenCode and Cursor"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Monish" }]
keywords = ["mcp", "codex", "claude-code", "gemini-cli", "opencode", "cursor", "agent-skills", "history", "memory", "handoff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9",
    "rapidfuzz>=3.0",
]

[project.scripts]
agent-history-mcp = "agent_history_mcp.server:run"
agent-history = "agent_history_mcp.cli:main"

[project.urls]
Homepage   = "https://github.com/Monishkumarvr/agent-history-mcp"
Repository = "https://github.com/Monishkumarvr/agent-history-mcp"
Issues     = "https://github.com/Monishkumarvr/agent-history-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_history_mcp"]
